services:
  postgres:
    image: postgres:16-alpine
    container_name: docksight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docksight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docksight}
      POSTGRES_DB: ${POSTGRES_DB:-docksight}
    ports:
      - "5432:5432"
    volumes:
      - docksight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docksight} -d ${POSTGRES_DB:-docksight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docksight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docksight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: infrastructure/docker/server.Dockerfile
    container_name: docksight-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      SERVER_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-docksight}:${POSTGRES_PASSWORD:-docksight}@postgres:5432/${POSTGRES_DB:-docksight}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/prisma:/app/apps/server/prisma

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: docksight-web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html

volumes:
  docksight_postgres_data:
  docksight_redis_data:
