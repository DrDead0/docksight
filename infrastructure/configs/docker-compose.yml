# DockSight local development infrastructure
# Starts PostgreSQL and Redis only.
# Frontend, backend, and agent run on the host — not in Compose.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — primary relational database for DockSight
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: docksight-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docksight}
      POSTGRES_USER: ${POSTGRES_USER:-docksight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - docksight-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-docksight} -d ${POSTGRES_DB:-docksight}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — cache / pub-sub placeholder for future realtime features
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: docksight-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - docksight-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

# ---------------------------------------------------------------------------
# Named volumes — persist data across container restarts
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:

# ---------------------------------------------------------------------------
# Dedicated network for DockSight development services
# ---------------------------------------------------------------------------
networks:
  docksight-network:
    name: docksight-network
    driver: bridge