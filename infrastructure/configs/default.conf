# Front door for the DockSight deployment.
#
#   browser ──> nginx ──┬── /       -> web    (static SPA)
#                       ├── /api/   -> server (REST + SSE log streams)
#                       └── /agents -> server (agent WebSocket)
#
# Agents connect through here too, so the WebSocket upgrade must be forwarded.

upstream docksight_web {
    server web:80;
}

upstream docksight_server {
    server server:8080;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://docksight_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://docksight_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Container logs are server-sent events. Without these, nginx buffers
        # the response and the log viewer stays empty until the stream ends.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # A follow=true log stream stays open indefinitely.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # DockSight agents connect over a raw WebSocket on this path.
    location /agents {
        proxy_pass http://docksight_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Agents are long-lived and only heartbeat periodically.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
