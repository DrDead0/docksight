# DockSight local development infrastructure

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — primary relational database for DockSight
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: docksight-postgres
    labels:
      com.docksight.internal: "true"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docksight}
      POSTGRES_USER: ${POSTGRES_USER:-docksight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docksight-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - docksight-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-docksight} -d ${POSTGRES_DB:-docksight}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — cache / pub-sub placeholder for realtime features
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: docksight-redis
    labels:
      com.docksight.internal: "true"
    restart: unless-stopped
   
    volumes:
      - redis-data:/data
    networks:
      - docksight-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    # Lowercase, always. A registry reference must be lowercase, and Docker
    # rejects the whole compose file with "invalid reference format" before it
    # tries to pull anything — a message that names the repository but never
    # says the capitals are the problem. GitHub renders the organisation as
    # "Open-Source-Kigali", which is what makes this so easy to reintroduce.
    image: ghcr.io/open-source-kigali/docksight-server:latest
    container_name: docksight-server
    labels:
      com.docksight.internal: "true"
    restart: unless-stopped
    # Build locally from the REPOSITORY ROOT — this is an npm workspaces
    # monorepo and the Dockerfile copies every workspace manifest:
    #   docker build -f apps/server/Dockerfile -t ghcr.io/open-source-kigali/docksight-server:1.1 .
    environment:
      # Must match the postgres service credentials above.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      PORT: 8080
      # Required — the server refuses to start without it. Generate with:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      JWT_SECRET: ${JWT_SECRET:-JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
    networks:
      - docksight-network
    # Wait for a healthy database: the entrypoint runs `prisma migrate deploy`
    # before booting and will exit if Postgres is not accepting connections.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Process up is not enough: the API must reach Postgres. Node is already in
    # the image (no curl/wget). start_period covers migrate + cold Nest boot.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  web:
    # See the note on the server image: lowercase is mandatory.
    #   docker build -f apps/web/Dockerfile -t ghcr.io/open-source-kigali/docksight-web:1.1 .
    image: ghcr.io/open-source-kigali/docksight-web:latest
    container_name: docksight-web
    labels:
      com.docksight.internal: "true"
    restart: unless-stopped
    networks:
      - docksight-network

  nginx:
    image: nginx:1.25-alpine
    container_name: docksight-nginx
    labels:
      com.docksight.internal: "true"
    restart: unless-stopped
    ports:
      - "${DOCKSIGHT_PORT:-2002}:80"
    volumes:
      # The config lives next to this file, not in a nginx/ subdirectory.
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - docksight-network
    depends_on:
      - web
      - server

# ---------------------------------------------------------------------------
# Named volumes — persist data across container restarts
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:

# ---------------------------------------------------------------------------
# Dedicated network for DockSight development services
# ---------------------------------------------------------------------------
networks:
  docksight-network:
    name: docksight-network
    driver: bridge
