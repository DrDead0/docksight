# DockSight Agent configuration (local development)

agent:
  data_dir: ./data
  identity_file: ./data/identity.json

server:
  # DockSight server WebSocket endpoint for agent registration
  url: ws://127.0.0.1:2002/agents

docker:
  # Leave empty to use the platform default.
  # This check is existence-only — no Docker API calls.
  socket: ""

logging:
  level: info
