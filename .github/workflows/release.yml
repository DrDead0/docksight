name: Release

# Cut a release by pushing a tag: CI builds all nine artifacts, uploads
# them to the GitHub release, and verifies every one is present. A missing
# artifact fails the run instead of shipping an incomplete release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # required to create a release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod

      - name: Build all artifacts
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Publish and verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}"
