name: Release

# Cut a release by pushing a tag: CI publishes the container images, builds
# all nine artifacts, uploads them to the GitHub release, and verifies every
# one is present. A missing artifact fails the run instead of shipping an
# incomplete release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # required to create a release
  packages: write        # required to push to ghcr.io

jobs:
  # The images go first, and the release job waits on them. The platform
  # bundle inside the release names these images by tag, so a release that
  # appeared before its images would be installable and immediately broken —
  # for however long the image build took.
  images:
    runs-on: ubuntu-latest

    strategy:
      # Both images are built even if one fails, so a single broken
      # Dockerfile does not hide a second one.
      fail-fast: false
      matrix:
        include:
          - name: docksight-server
            dockerfile: apps/server/Dockerfile
          - name: docksight-web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects an uppercase repository name, and the organisation is
      # spelled "Open-Source-Kigali". Lowercasing here is what keeps the
      # pushed name identical to the one the compose bundle references.
      - name: Resolve the registry namespace
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build context is the repository root, not the Dockerfile's own
      # directory: this is an npm workspaces monorepo and every workspace
      # manifest has to be present before `npm ci` can resolve the tree.
      #
      # Only linux/amd64 is built. Adding linux/arm64 means QEMU emulation of
      # a Node build, which takes long enough to dominate the release. Add
      # `platforms:` here when an ARM host actually needs to run the platform;
      # the agent, which is what runs on a small ARM box, already ships arm64.
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod

      # build-release.sh stamps the bundle's image tags with the version being
      # built, so the compose file shipped here names the images the job above
      # has just pushed.
      - name: Build all artifacts
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Publish and verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}"
